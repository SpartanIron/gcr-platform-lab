apiVersion: apps/v1
kind: Deployment

metadata:
  name: platform-dashboard

spec:
  replicas: 2

  selector:
    matchLabels:
      app: platform-dashboard

  template:
    metadata:
      labels:
        app: platform-dashboard

    spec:
      containers:
      - name: dashboard
        image: platform-dashboard:v1
        imagePullPolicy: Never

        ports:
        - containerPort: 80